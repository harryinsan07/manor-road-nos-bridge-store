<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#075b83">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Manor Road Store">

  <title>Manor Road NOS Bridge Store</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">

  <style>
    :root {
      color-scheme: light;
      --brand-blue: #075b83;
      --brand-dark: #063f5b;
      --background: #f4fbfd;
      --muted-text: #526875;
      --card-background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      background: var(--background);
      color: var(--brand-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 420px);
      padding: 32px 24px;
      background: var(--card-background);
      border-radius: 24px;
      box-shadow: 0 16px 42px rgba(7, 91, 131, 0.14);
    }

    .logo {
      width: 150px;
      height: 150px;
      display: block;
      margin: 0 auto;
      border-radius: 28px;
      box-shadow: 0 12px 32px rgba(7, 91, 131, 0.22);
    }

    h1 {
      margin: 22px 0 10px;
      font-size: clamp(24px, 6vw, 30px);
      line-height: 1.18;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted-text);
      font-size: 16px;
      line-height: 1.5;
    }

    .open-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      min-height: 50px;
      padding: 14px 24px;
      border-radius: 14px;
      background: var(--brand-blue);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(7, 91, 131, 0.22);
    }

    .open-button:focus-visible {
      outline: 3px solid rgba(7, 91, 131, 0.35);
      outline-offset: 4px;
    }

    .status {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted-text);
    }
  </style>
</head>

<body>
  <main>
    <img
      class="logo"
      src="icon-512.png"
      alt="Barhale logo"
      width="150"
      height="150"
    >

    <h1>Manor Road NOS Bridge Store</h1>

    <p id="message">
      Add this page to your Home Screen for one-tap access.
    </p>

    <a
      class="open-button"
      id="open-store"
      href="https://script.google.com/macros/s/AKfycbzFnm8F9VWR-HUAZxSoAUahTgF5bAtaoGh0pbPhbSq8ccK9mgSBgOOoVF4wFj-mmSER/exec"
    >
      Open Store
    </a>

    <div class="status" id="status" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      "use strict";

      var STORE_URL =
        "https://script.google.com/macros/s/AKfycbzFnm8F9VWR-HUAZxSoAUahTgF5bAtaoGh0pbPhbSq8ccK9mgSBgOOoVF4wFj-mmSER/exec";

      var isIOSStandalone = window.navigator.standalone === true;
      var isDisplayModeStandalone =
        window.matchMedia &&
        window.matchMedia("(display-mode: standalone)").matches;

      var isHomeScreenApp = isIOSStandalone || isDisplayModeStandalone;

      if (isHomeScreenApp) {
        var message = document.getElementById("message");
        var status = document.getElementById("status");

        if (message) {
          message.textContent = "Opening secure tool management…";
        }

        if (status) {
          status.textContent = "Please wait";
        }

        window.setTimeout(function () {
          window.location.replace(STORE_URL);
        }, 250);
      }
    })();
  </script>
</body>
</html>
